<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Crear Cuenta - Gestor Finanzas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="register.css">
</head>
<body>

<div class="container">
  <div class="card">
    <div class="card-header">
      <h2>Crear una cuenta</h2>
      <p>Empieza a gestionar tus gastos hoy</p>
    </div>

    <form id="registerForm">
      <div class="form-group">
        <label for="nombre">Nombre Completo</label>
        <input type="text" id="nombre" placeholder="Tu nombre" required>
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" placeholder="ejemplo@correo.com" required>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="Crea una contraseña segura" required>
      </div>

      <button type="submit" class="btn-primary">Registrarse</button>
    </form>

    <div class="card-footer">
      <p>¿Ya tienes cuenta? <a href="index.html">Inicia Sesión</a></p>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/register.js"></script>

</body>
</html>
