<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Gastos</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<h1>Lista de Gastos</h1>

<a th:href="@{/gastos/nuevo}">Nuevo Gasto</a>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Descripción</th>
        <th>Monto</th>
        <th>Fecha</th>
        <th>Categoría</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="gasto : ${gastos}">
        <td th:text="${gasto.id}"></td>
        <td th:text="${gasto.descripcion}"></td>
        <td th:text="${gasto.monto}"></td>
        <td th:text="${gasto.fecha}"></td>
        <td th:text="${gasto.categoria != null ? gasto.categoria.nombre : 'Sin categoría'}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
