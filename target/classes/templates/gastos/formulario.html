<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Gasto</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<h1>Nuevo Gasto</h1>

<form th:action="@{/gastos}" th:object="${gasto}" method="post">
    <label for="descripcion">Descripción:</label>
    <input type="text" id="descripcion" th:field="*{descripcion}" required>
    <br>

    <label for="monto">Monto:</label>
    <input type="number" step="0.01" id="monto" th:field="*{monto}" required>
    <br>

    <label for="fecha">Fecha:</label>
    <input type="date" id="fecha" th:field="*{fecha}" required>
    <br>

    <label for="categoria">Categoría:</label>
    <select id="categoria" th:field="*{categoria}">
        <option th:value="">-- Seleccionar --</option>
        <option th:each="cat : ${#lists.arrayList('Comida','Transporte','Ocio')}"
                th:value="${cat}" th:text="${cat}"></option>
    </select>
    <br>

    <button type="submit">Guardar</button>
</form>

<a th:href="@{/gastos}">Volver a la lista</a>
</body>
</html>
